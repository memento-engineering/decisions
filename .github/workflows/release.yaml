name: release

# Packages the standalone decisions CLI on each decisions-v<version> tag. The
# tag is cut by the gated release command
# (memento-engineering#releases-publish-only-through-the-gated-release-command);
# this workflow only builds, checks and attaches what that tag names. See
# docs/decisions/2026-10-17-the-decisions-cli-ships-as-prebuilt-binaries.md.
on:
  push:
    tags: ['decisions-v*']

permissions:
  contents: read

env:
  # The Gas City pack source the release notes print, and the one
  # gc_pack_published imports, so the published install line and its smoke
  # test read the same value. gc_pack/decisions/README.md prints it too.
  GC_PACK_SOURCE: https://github.com/memento-engineering/decisions/tree/main/gc_pack/decisions

jobs:
  build:
    # One native runner per target, so every binary is executed before it is
    # attached rather than only compiled.
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-14
            target: macos-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: cli/dart/decisions
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          # Keep in step with ci.yaml.
          sdk: 3.12.2
      - run: dart pub get
      - name: Compile
        run: |
          version="${GITHUB_REF_NAME#decisions-v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ASSET=decisions-$version-${{ matrix.target }}" >> "$GITHUB_ENV"
          dart compile exe bin/decisions.dart -o "decisions-$version-${{ matrix.target }}"
      - name: The binary reports the tagged version
        run: |
          reported="$(./"$ASSET" --version)"
          echo "$reported"
          case "$reported" in
            "decisions $VERSION "*) ;;
            *) echo "tag says $VERSION; the binary does not" >&2; exit 1 ;;
          esac
      - name: The binary lints this repo's own register clean
        run: ./"$ASSET" lint ../../../docs/decisions --repo-root ../../..
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: cli/dart/decisions/${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.publish.outputs.prerelease }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      # For the tag ref: the Gas City pin is the commit it names. Reading it
      # needs no credentials, so the write-scoped token stays out of .git.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksum
        working-directory: dist
        run: |
          sha256sum decisions-* > SHA256SUMS
          cat SHA256SUMS
      - id: pin
        name: The Gas City pin
        run: |
          # Peeled, so an annotated tag and a lightweight one give the same
          # answer: a sha: pin must name a commit, not a tag object.
          sha=$(git rev-parse "$GITHUB_REF^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME is commit $sha"
      - id: publish
        name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          # A version with a prerelease suffix (0.3.0-rc.1) is a prerelease.
          # Stable promotion is a human act
          # (memento-engineering#agents-publish-prereleases-humans-promote-to-stable).
          prerelease=false
          flag=
          case "${GITHUB_REF_NAME#decisions-v}" in
            *-*) prerelease=true; flag=--prerelease ;;
          esac
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          # A notes file, not --notes: the text holds backticks and quotes.
          notes="$RUNNER_TEMP/release-notes.md"
          readme="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/gc_pack/decisions/README.md"
          {
            printf '%s\n\n' 'Standalone decisions CLI. Verify downloads against SHA256SUMS.'
            # The backticks are Markdown, not command substitution.
            # shellcheck disable=SC2016
            printf 'Gas City: in `[rigs.imports.decisions]` set `version = "sha:%s"` (source `%s`); see [gc_pack/decisions/README.md](%s).\n' \
              "$SHA" "$GC_PACK_SOURCE" "$readme"
          } > "$notes"
          cat "$notes"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes" \
            $flag

  tap:
    # Homebrew serves stable releases only; prereleases stay on GitHub.
    needs: release
    if: needs.release.outputs.prerelease == 'false'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.2
      - uses: actions/checkout@v4
        with:
          repository: memento-engineering/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Render the formula from the published checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#decisions-v}"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          mkdir -p homebrew-tap/Formula
          (cd cli/dart/decisions && dart pub get >&2 && dart run tool/homebrew_formula.dart \
            "$version" "$RUNNER_TEMP/SHA256SUMS") > homebrew-tap/Formula/decisions.rb
      - name: Push the bump to the tap
        working-directory: homebrew-tap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/decisions.rb
          if git diff --cached --quiet; then
            echo 'formula already current'
            exit 0
          fi
          git commit -m "decisions ${GITHUB_REF_NAME#decisions-v}"
          git push

  gc_pack_published:
    # The Gas City install line the release notes print, run as an adopter
    # would run it: the real GitHub tree URL pinned at sha:<this tag's commit>,
    # served by the release's own linux-x64 binary. It is the only test of the
    # tree-URL source with a sha: pin, and it needs the network. Prereleases
    # run it too: the pin works for them, and the doctor hint's pinned-download
    # route covers the formula they lack.
    #
    # Nothing depends on this job and it undoes nothing: the release is out,
    # and the tap job runs beside it. A red run means the published install
    # line is wrong, and it is fixed forward (the pack README, or a new
    # release); the tag and the release stay. Rerun it by hand with
    # gc_pack/e2e.sh --published <tag> <sha>; see AGENTS.md.
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gc-sandbox-tools
      # What adopters download, checked as they are told to check it; not a
      # fresh compile.
      - name: Download the release's linux-x64 binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="decisions-${GITHUB_REF_NAME#decisions-v}-linux-x64"
          dir="$RUNNER_TEMP/release"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --pattern "$asset" --pattern SHA256SUMS --dir "$dir"
          (cd "$dir" && grep " $asset\$" SHA256SUMS | sha256sum -c -)
          install -m 0755 "$dir/$asset" "$RUNNER_TEMP/bin/decisions"
          "$RUNNER_TEMP/bin/decisions" --version
      # The script sandboxes HOME, GC_HOME and XDG itself; nothing calls gc
      # outside that sandbox.
      - name: gc_pack/e2e.sh --published
        env:
          SHA: ${{ needs.release.outputs.sha }}
        run: |
          GC_BIN="$RUNNER_TEMP/bin/gc" BD_BIN="$RUNNER_TEMP/bin/bd" \
            DOLT_BIN="$RUNNER_TEMP/bin/dolt" DECISIONS_BIN="$RUNNER_TEMP/bin/decisions" \
            E2E_PUBLISHED_SOURCE="$GC_PACK_SOURCE" \
            gc_pack/e2e.sh --published "$GITHUB_REF_NAME" "$SHA"
