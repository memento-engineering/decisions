name: decisions_grid_assets
description: >-
  The tier-2 grid adapter for decisions: packaged station skills and a
  roster-aware composed decisions command.
version: 0.2.1
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  decisions:
    path: ../../cli/dart/decisions
  # rc.13 retired AssetsCommand(overlayRoots:) — adopt it deliberately (see the
  # decisions store), never by a fresh resolve.
  grid_assets: '>=0.6.0-rc.5 <0.6.0-rc.13'
  path: ^1.9.0

dev_dependencies:
  args: ^2.6.0
  lints: ^5.1.0
  test: ^1.25.0
  yaml: ^3.1.2
