name: decisions
description: >-
  The deterministic engine under the decisions register pattern: parse a MADR
  profile register into a citation graph, lint it, and render its views. No
  grid dependency — a repo with no station uses this directly.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.6.0
  glob: ^2.2.0
  json_annotation: ^4.12.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  build_runner: ^2.16.0
  json_schema: ^5.2.2
  json_serializable: ^6.14.1
  lints: ^5.1.0
  test: ^1.25.0
